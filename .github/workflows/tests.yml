name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = verified dev runtime; 3.12 = AGENTS.md target (CI-only leg).
        # Dependency floor is 3.10 (fastapi/uvicorn/jsonschema/pytest pins).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run test suite
        run: pytest

      - name: Validate contracts against fixtures
        run: python scripts/validate_contracts.py
