# Test-suite configuration only — not an installable package.
# Backend deps live in backend/requirements.txt; run tests from the repo root: `pytest`
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: long-running tests",
    "live_llm: would call watsonx.ai — never enabled in CI or local default runs",
]
